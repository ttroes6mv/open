<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd400">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>どれみピアノ（2オクターブ）</title>
<style>
  :root{
    --bg:#ffd400;
    --frame:#ffffff;
    --line:#d8d8d8;
    --ui:#ffffff;
    --text:#333;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* ゆびが 2ほん ふれても ページが うごかない ように する */
  html,body{
    margin:0; padding:0;
    position:fixed; inset:0;
    width:100%; height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
  }
  body{
    height:100dvh;
    background:var(--bg);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",-apple-system,"Segoe UI",sans-serif;
    color:var(--text);
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    position:relative;
  }
  #app{
    position:absolute; inset:0;
    display:flex; flex-direction:row; gap:6px;   /* ボタン列（ひだり）＋ けんばん（みぎ）*/
    padding:
      calc(env(safe-area-inset-top) + 6px)
      calc(env(safe-area-inset-right) + 10px)
      calc(env(safe-area-inset-bottom) + 8px)
      calc(env(safe-area-inset-left) + 10px);
  }
  /* ===== そうさボタン（ひだりに たて1れつ・うえした いっぱい）=====
     iPad を よこ に たおすと、この れつ が そのまま けんばん の うえ に くる */
  #bar{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:stretch; gap:6px;
    width:clamp(112px, 20%, 190px);
    height:100%;
  }
  button{
    position:relative;
    font:inherit; font-weight:700; font-size:17px;
    color:var(--text); background:var(--ui);
    border:none; border-radius:12px;
    flex:1 1 0;                      /* うえした いっぱい に ひろげる */
    width:100%; min-height:48px; padding:0;
    box-shadow:0 3px 0 rgba(0,0,0,.16);
    overflow:hidden;
  }
  button.icon{flex:0.6 1 0; font-size:20px;}
  button{touch-action:none;}
  /* もじを 90ど ひだり に まわす。ほんたい を とけい まわり に たおすと まっすぐ よめる */
  button > .lbl{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(-90deg);
    white-space:nowrap; line-height:1.15;
    text-align:center;
  }
  button:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.16);}
  button:disabled{opacity:.35;}
  button .k{font-size:11px; display:block; opacity:.55; line-height:1.2; font-weight:700;}
  #lock.on{background:#ff5a5a; color:#fff;}
  body.locked #bar button:not(#lock){opacity:.3; pointer-events:none;}

  /* ===== 鍵盤 ===== */
  #piano{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    background:var(--frame);
    border-radius:10px;
    overflow:hidden;
    touch-action:none;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .white{
    position:absolute; left:0; right:0;
    background:#fff;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:flex-end;
    padding-right:2.5%;
    gap:1.5%;
    transition:background .06s linear;
  }
  .white.on{background:#fff2b0;}
  .black{
    position:absolute; left:0;
    width:58%; max-width:440px;
    background:#161616;
    border-radius:0 6px 6px 0;
    box-shadow:0 3px 6px rgba(0,0,0,.35);
    z-index:3;
    transition:background .06s linear, transform .06s linear;
  }
  .black.on{background:#5c5c5c; transform:scaleY(.94);}

  /* ラベル（かお + まる） */
  .face{flex:0 0 auto; pointer-events:none; transform:rotate(-90deg);}
  .badge{
    flex:0 0 auto; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    color:#fff; font-weight:700;
    letter-spacing:-.04em;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);
  }
  .badge > span{transform:rotate(-90deg);}
  body.names-off .face, body.names-off .badge{display:none;}

  /* バージョン（キャッシュで ふるい ものを みて いない か たしかめる ため） */
  /* 90ど まわすと、きてん から「じぶんの たかさ ぶん」ひだり に はみだす。
     その ぶん（18px）だけ ひだりを あけて おく と きれない。 */
  #ver{
    position:absolute; z-index:8; pointer-events:none;
    left:18px; bottom:8px;
    height:18px; line-height:18px; padding:0 6px;
    font-size:13px; font-weight:700; color:#8a8a8a;
    background:#f0f0f0; border-radius:9px;
    transform:rotate(-90deg); transform-origin:left bottom;
  }

  /* とんでいく♪ */
  .spark{
    position:absolute; z-index:9; pointer-events:none;
    font-size:28px; color:#ff5aa8; text-shadow:0 1px 0 #fff;
    animation:fly .8s ease-out forwards;
  }
  @keyframes fly{
    from{opacity:1; transform:translate(0,0) rotate(0deg) scale(.8);}
    to{opacity:0; transform:translate(-70px,-46px) rotate(-24deg) scale(1.5);}
  }
</style>
</head>
<body>

<div id="app">
<div id="bar">
  <button id="octMinus" aria-label="ひくい おと"><span class="lbl">◀ ひくい</span></button>
  <button id="octCount"><span class="lbl"><span class="k">おとのかず</span>2オクターブ</span></button>
  <button id="octPlus" aria-label="たかい おと"><span class="lbl">たかい ▶</span></button>
  <button id="inst"><span class="lbl"><span class="k">がっき</span>ピアノ</span></button>
  <button id="names"><span class="lbl"><span class="k">なまえ</span>ひらがな</span></button>
  <button id="lock" class="icon" aria-label="ボタンを ロック"><span class="lbl">🔒</span></button>
  <button id="full" class="icon" aria-label="ぜんがめん"><span class="lbl">⛶</span></button>
</div>

<div id="piano"></div>
</div>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ *
 * おとの じょうほう
 * ------------------------------------------------------------------ */
const WHITE = {                       // pitchClass -> ラベルと いろ(HSL)
   0:{ja:'ど',   abc:'C', h:  2, s:78, l:48},
   2:{ja:'れ',   abc:'D', h: 28, s:92, l:48},
   4:{ja:'み',   abc:'E', h: 78, s:58, l:44},
   5:{ja:'ふぁ', abc:'F', h:145, s:80, l:34},
   7:{ja:'そ',   abc:'G', h:215, s:78, l:48},
   9:{ja:'ら',   abc:'A', h:275, s:52, l:48},
  11:{ja:'し',   abc:'B', h:325, s:82, l:47}
};
const isWhite = m => WHITE.hasOwnProperty(((m % 12) + 12) % 12);
const freqOf  = m => 442 * Math.pow(2, (m - 69) / 12);   // A=442Hz（もらった コード に あわせる）
const clamp   = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);

const state = {
  baseOctave : 4,       // いちばん ひくい ど（C4 = まんなかのド）
  octaves    : 2,
  inst       : 0,
  names      : 0,       // 0:ひらがな 1:ABC 2:なし
  locked     : false
};

/* このファイルの ばんごう。けんばん の ひだりした に でる。
   かえた のに ここが かわらない ときは キャッシュ（ふるい ファイル）を みている。 */
const VERSION = 'v14';

/* ================================================================== *
 * おとの エンジン（FM がっせい）
 *   ・サイン波の しゅうはすう を べつの サイン波 で ゆらして おとを つくる
 *   ・ゆらし を すぐ おさめる と「ピン」と いう あたま に なり、
 *     そのあと ながく のびる ほんたい が のこる
 *   ・ゆびを はなしても（オルガン いがいは）さいごまで なりきる
 * ================================================================== */
let ctx = null, bus = null, master = null;

function audio(){
  if(ctx) return ctx;
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  // おとが われない ように ピークだけ おさえる
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -3;
  limiter.knee.value      = 6;
  limiter.ratio.value     = 20;
  limiter.attack.value    = 0.002;
  limiter.release.value   = 0.15;
  limiter.connect(ctx.destination);

  master = ctx.createGain();
  master.gain.value = 0.85;
  master.connect(limiter);

  bus = ctx.createGain();
  bus.gain.value = 1;
  bus.connect(master);

  return ctx;
}

function unlock(){
  const c = audio();
  if(c.state === 'suspended') c.resume();
  const b = c.createBufferSource();
  b.buffer = c.createBuffer(1, 1, 22050);
  b.connect(master); b.start(0);
}

/* ---- がっき ----
 * FM（しゅうはすう へんちょう）で おとを つくる。
 * キャリア（きこえる サイン波）の しゅうはすう を、モジュレーター（もう1つの
 * サイン波）で ゆらす と、ゆらし かた しだいで ベル にも ピアノ にも なる。
 *   ratio … キャリア に たいする モジュレーター の しゅうはすう の ひ
 *   index … ゆらし の つよさ（おおきい ほど ばいおん が ふえる）
 *   idec  … ゆらし が おさまる までの びょうすう（みじかい ほど「ピン」）
 * dec … おとが きえる までの びょうすう（まんなかの ド の とき）
 */
const INSTS = ['ピアノ','オルガン','ベル','マリンバ'];
const VOICE = [
  { // ピアノ：もらった コード と おなじ つくり
    //   サイン波 1つ を そのまま ならして、0.5びょう ご に とめる だけ。
    //   おんりょう の カーブ（エンベロープ）は つけない。
    simple:{type:'sine', dec:0.5}, hold:false, level:1.0 },
  { // オルガン：おしている あいだ ずっと なる（FM なし・サイン波を かさねる）
    parts:[[1,1],[2,0.5],[4,0.25],[8,0.10]],
    dec:0, decSlope:0, atk:0.020, hold:true, rel:0.08, level:0.47 },
  { // ベル
    fm:[{ratio:3.5, index:3.2, idec:1.0}],
    dec:5.0, decSlope:24, atk:0.002, hold:false, level:0.70 },
  { // マリンバ
    fm:[{ratio:4, index:1.8, idec:0.07}],
    dec:1.6, decSlope:22, atk:0.002, hold:false, level:1.15 }
];

const voices  = new Map();    // midi -> いま おされて いる おと
const ringing = [];           // ゆびを はなした あと、まだ なりつづけて いる おと
const MAX_SOUNDS = 18;

function fade(v, sec){
  const c = audio(), t = c.currentTime;
  try{
    if(v.g.gain.cancelAndHoldAtTime) v.g.gain.cancelAndHoldAtTime(t);
    else v.g.gain.cancelScheduledValues(t);
    v.g.gain.setTargetAtTime(0.0001, t, Math.max(sec, 0.01) / 3);
  }catch(e){}
  v.oscs.forEach(o => { try{ o.stop(t + sec + 0.05); }catch(e){} });
  const i = ringing.indexOf(v);
  if(i >= 0) ringing.splice(i, 1);
}

function noteOn(midi){
  const c = audio();
  if(c.state === 'suspended') c.resume();

  // おなじ けん を もう いちど おしたら、まえの おとは すばやく けす
  if(voices.has(midi)){ fade(voices.get(midi), 0.03); voices.delete(midi); }
  for(let i = ringing.length - 1; i >= 0; i--)
    if(ringing[i].midi === midi) fade(ringing[i], 0.03);
  while(voices.size + ringing.length >= MAX_SOUNDS && ringing.length) fade(ringing[0], 0.05);

  const v = VOICE[state.inst];
  const t = c.currentTime + 0.002;
  const f = freqOf(midi);

  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.connect(bus);

  const oscs = [];
  let end;

  if(v.hold){                       // ---- オルガン（かさん合成）----
    const sum = v.parts.reduce((a, p) => a + p[1], 0);
    const peak = 0.55 * v.level / sum * Math.pow(2, -(midi - 60) / 60);
    g.gain.linearRampToValueAtTime(peak, t + v.atk);
    end = t + 3600;
    v.parts.forEach(([ratio, amp]) => {
      const o = c.createOscillator(), pg = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f * ratio, t);
      pg.gain.setValueAtTime(amp, t);
      o.connect(pg); pg.connect(g);
      o.start(t); o.stop(end);
      oscs.push(o);
    });
  }else if(v.simple){               // ---- ピアノ（もらった コード と おなじ）----
    // もらった コード どおり、おんりょう は かえない（エンベロープ なし）。
    // ぜんたいの おおきさ だけ、わおん でも われない ように さげて ある。
    const k = 0.16 * v.level;
    g.gain.setValueAtTime(k, t);
    end = t + v.simple.dec;

    const osc = c.createOscillator();
    osc.type = v.simple.type;
    osc.frequency.value = freqOf(midi);
    osc.connect(g);
    osc.start(t); osc.stop(end);
    oscs.push(osc);

  }else{                            // ---- FM の がっき ----
    const dec  = clamp(v.dec * Math.pow(2, -(midi - 60) / v.decSlope), 0.3, 9);
    const peak = 0.42 * v.level * Math.pow(2, -(midi - 60) / 60);
    g.gain.linearRampToValueAtTime(peak, t + v.atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + v.atk + dec);
    end = t + v.atk + dec + 0.05;

    const carrier = c.createOscillator();
    carrier.type = 'sine';
    carrier.frequency.setValueAtTime(f, t);

    v.fm.forEach(m => {
      const mod = c.createOscillator(), mg = c.createGain();
      mod.type = 'sine';
      mod.frequency.setValueAtTime(f * m.ratio, t);
      // ゆらし の おおきさ は「しゅうはすう を なんHz うごかすか」で きめる
      const dev = m.index * f * m.ratio;
      mg.gain.setValueAtTime(dev, t);
      mg.gain.exponentialRampToValueAtTime(Math.max(dev * 0.002, 1), t + m.idec);
      mod.connect(mg); mg.connect(carrier.frequency);
      mod.start(t); mod.stop(end);
      oscs.push(mod);
    });

    carrier.connect(g);
    carrier.start(t); carrier.stop(end);
    oscs.push(carrier);
  }

  voices.set(midi, {g:g, oscs:oscs, midi:midi, hold:v.hold, end:end});
}

/* ゆびを はなした とき
 *   オルガン … すぐ とめる
 *   ピアノ など … とめない。さいごまで なりきる（タップ でも みじかく ならない）
 */
function noteOff(midi){
  const v = voices.get(midi);
  if(!v) return;
  voices.delete(midi);
  if(v.hold){
    fade(v, VOICE[state.inst].rel || 0.08);
  }else{
    ringing.push(v);
    setTimeout(() => { const i = ringing.indexOf(v); if(i >= 0) ringing.splice(i, 1); },
               Math.max((v.end - audio().currentTime) * 1000, 0) + 200);
  }
}

function allOff(){ [...voices.values()].forEach(v => fade(v, 0.05)); voices.clear();
                   [...ringing].forEach(v => fade(v, 0.05)); }

/* ------------------------------------------------------------------ *
 * けんばんを つくる（うえが たかい おと）
 * ------------------------------------------------------------------ */
const piano = document.getElementById('piano');
const keyEls = new Map();

function build(){
  piano.innerHTML = '';
  keyEls.clear();

  const lo = 12 * (state.baseOctave + 1);          // C4 = 60
  const hi = lo + 12 * state.octaves;
  const whites = [];
  for(let m = hi; m >= lo; m--) if(isWhite(m)) whites.push(m);   // うえ→した

  const n = whites.length;
  const hPct = 100 / n;
  const badge = clamp((piano.clientHeight / n) * 0.78, 22, 52);
  const faceW = Math.min(34, badge * 0.8);

  whites.forEach((m, i) => {
    const info = WHITE[m % 12];
    const oct  = Math.floor((m - lo) / 12);
    const el = document.createElement('div');
    el.className = 'white';
    el.style.top    = (i * hPct) + '%';
    el.style.height = hPct + '%';
    el.dataset.midi = m;

    // たかい オクターブ ほど すこし あかるい いろ
    const color = 'hsl(' + info.h + ',' + info.s + '%,' + (info.l - 5 + Math.min(oct, 3) * 7) + '%)';
    el.innerHTML =
      '<svg class="face" width="' + faceW + '" height="' + (faceW * 0.72) + '" viewBox="0 0 34 24">' +
        '<circle cx="8"  cy="7" r="2.4" fill="#2b2b2b"/>' +
        '<circle cx="19" cy="7" r="2.4" fill="#2b2b2b"/>' +
        '<path d="M5 12 q8.5 9 17 0" stroke="#f7a6a6" stroke-width="3" fill="none" stroke-linecap="round"/>' +
        '<circle cx="3"  cy="14" r="3" fill="#ffc8c8"/>' +
        '<circle cx="24" cy="14" r="3" fill="#ffc8c8"/>' +
      '</svg>' +
      '<div class="badge" style="width:' + badge + 'px;height:' + badge + 'px;' +
        'font-size:' + (badge * (info.ja.length > 1 ? 0.36 : 0.5)) + 'px;background:' + color + ';' +
        (oct > 0 ? 'box-shadow:inset 0 0 0 3px rgba(255,255,255,.85), inset 0 -2px 0 rgba(0,0,0,.12);' : '') +
      '"><span>' + (state.names === 1 ? info.abc + (Math.floor(m / 12) - 1) : info.ja) + '</span></div>';

    piano.appendChild(el);
    keyEls.set(m, el);
  });

  const bh = hPct * 0.62;
  for(let i = 0; i < n - 1; i++){
    if(whites[i] - whites[i+1] !== 2) continue;
    const m = whites[i] - 1;
    const el = document.createElement('div');
    el.className = 'black';
    el.style.top = ((i + 1) * hPct - bh / 2) + '%';
    el.style.height = bh + '%';
    el.dataset.midi = m;
    piano.appendChild(el);
    keyEls.set(m, el);
  }

  const v = document.createElement('div');
  v.id = 'ver';
  v.textContent = VERSION;
  piano.appendChild(v);
}

/* ------------------------------------------------------------------ *
 * タッチ（ゆびを なんぼんでも OK）
 * ------------------------------------------------------------------ */
const pointers = new Map();

function midiAt(x, y){
  const hit = document.elementFromPoint(x, y);
  const el  = hit && hit.closest ? hit.closest('[data-midi]') : null;
  return el ? +el.dataset.midi : null;
}
function press(id, midi){
  const cur = pointers.get(id);
  if(cur === midi) return;
  if(cur !== undefined) release(id);
  if(midi === null || midi === undefined) return;
  pointers.set(id, midi);
  const el = keyEls.get(midi);
  if(el){ el.classList.add('on'); spark(el); }
  noteOn(midi);
}
function release(id){
  const midi = pointers.get(id);
  if(midi === undefined) return;
  pointers.delete(id);
  let held = false;
  pointers.forEach(v => { if(v === midi) held = true; });
  if(!held){
    const el = keyEls.get(midi);
    if(el) el.classList.remove('on');
    noteOff(midi);
  }
}
function spark(el){
  const s = document.createElement('div');
  s.className = 'spark';
  s.textContent = Math.random() < .5 ? '♪' : '♫';
  s.style.left = (el.offsetLeft + el.offsetWidth - 60) + 'px';
  s.style.top  = (el.offsetTop + el.offsetHeight / 2 - 20) + 'px';
  piano.appendChild(s);
  s.addEventListener('animationend', () => s.remove());
}

piano.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlock();
  press(e.pointerId, midiAt(e.clientX, e.clientY));
});
piano.addEventListener('pointermove', e => {
  if(!pointers.has(e.pointerId)) return;
  e.preventDefault();
  press(e.pointerId, midiAt(e.clientX, e.clientY));
});
['pointerup','pointercancel','pointerleave'].forEach(t =>
  window.addEventListener(t, e => release(e.pointerId))
);
// ゆび が なんぼん ふれても スクロール させない（passive:false が ひつよう）
document.addEventListener('touchmove',  e => e.preventDefault(), {passive:false});
document.addEventListener('gesturestart',  e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => { [...pointers.keys()].forEach(release); allOff(); });

/* ------------------------------------------------------------------ *
 * ボタン
 * ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
function refresh(){
  const lbl = (id, html) => { $(id).querySelector('.lbl').innerHTML = html; };
  lbl('octCount', '<span class="k">おとのかず</span>' + state.octaves + 'オクターブ');
  lbl('inst',     '<span class="k">がっき</span>' + INSTS[state.inst]);
  lbl('names',    '<span class="k">なまえ</span>' + ['ひらがな','ABC','なし'][state.names]);
  document.body.classList.toggle('names-off', state.names === 2);
  $('octMinus').disabled = state.baseOctave <= 1;
  $('octPlus').disabled  = state.baseOctave + state.octaves >= 8;
  build();
  save();
}
$('octCount').onclick = () => { state.octaves = state.octaves === 2 ? 3 : (state.octaves === 3 ? 1 : 2);
                                if(state.baseOctave + state.octaves > 8) state.baseOctave = 8 - state.octaves;
                                allOff(); refresh(); };
$('octMinus').onclick = () => { if(state.baseOctave > 1){ state.baseOctave--; allOff(); refresh(); } };
$('octPlus').onclick  = () => { if(state.baseOctave + state.octaves < 8){ state.baseOctave++; allOff(); refresh(); } };
$('inst').onclick     = () => { allOff(); state.inst = (state.inst + 1) % INSTS.length; unlock(); refresh(); };
$('names').onclick    = () => { state.names = (state.names + 1) % 3; refresh(); };
$('lock').onclick     = () => { state.locked = !state.locked;
                                $('lock').classList.toggle('on', state.locked);
                                $('lock').querySelector('.lbl').textContent = state.locked ? '🔓' : '🔒';
                                document.body.classList.toggle('locked', state.locked); };
$('full').onclick     = () => {
  const el = document.documentElement;
  if(document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }else if(el.requestFullscreen || el.webkitRequestFullscreen){
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
};
if(!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)){
  $('full').style.display = 'none';
}

function save(){
  try{ localStorage.setItem('doremi', JSON.stringify(
    {baseOctave:state.baseOctave, octaves:state.octaves, inst:state.inst, names:state.names})); }catch(e){}
}
try{
  const s = JSON.parse(localStorage.getItem('doremi') || 'null');
  if(s) Object.assign(state, s);
}catch(e){}

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
window.addEventListener('orientationchange', () => setTimeout(build, 300));

refresh();
})();
</script>
</body>
</html>
