<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd400">
<title>どれみピアノ（2オクターブ）</title>
<style>
  :root{
    --bg:#ffd400;
    --frame:#ffffff;
    --line:#d8d8d8;
    --ui:#ffffff;
    --text:#333;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{
    height:100dvh;
    background:var(--bg);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",-apple-system,"Segoe UI",sans-serif;
    color:var(--text);
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
    display:flex; flex-direction:column;
    padding:
      calc(env(safe-area-inset-top) + 6px)
      calc(env(safe-area-inset-right) + 10px)
      calc(env(safe-area-inset-bottom) + 8px)
      calc(env(safe-area-inset-left) + 10px);
    gap:6px;
  }

  /* ===== そうさボタン（うえに よせる） ===== */
  #bar{
    flex:0 0 auto;
    display:flex; align-items:stretch; gap:6px;
    width:100%;
  }
  button{
    font:inherit; font-weight:700; font-size:17px;
    color:var(--text); background:var(--ui);
    border:none; border-radius:12px;
    flex:1 1 0; min-width:0;
    min-height:52px; padding:6px 4px;
    box-shadow:0 3px 0 rgba(0,0,0,.16);
    white-space:nowrap; overflow:hidden;
  }
  button.icon{flex:0 0 78px; font-size:20px;}
  button:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.16);}
  button:disabled{opacity:.35;}
  button .k{font-size:11px; display:block; opacity:.55; line-height:1.2; font-weight:700;}
  #lock.on{background:#ff5a5a; color:#fff;}
  body.locked #bar button:not(#lock){opacity:.3; pointer-events:none;}

  /* ===== 鍵盤 ===== */
  #piano{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    background:var(--frame);
    border-radius:10px;
    overflow:hidden;
    touch-action:none;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .white{
    position:absolute; left:0; right:0;
    background:#fff;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:flex-end;
    padding-right:2.5%;
    gap:1.5%;
    transition:background .06s linear;
  }
  .white.on{background:#fff2b0;}
  .black{
    position:absolute; left:0;
    width:58%; max-width:440px;
    background:#161616;
    border-radius:0 6px 6px 0;
    box-shadow:0 3px 6px rgba(0,0,0,.35);
    z-index:3;
    transition:background .06s linear, transform .06s linear;
  }
  .black.on{background:#5c5c5c; transform:scaleY(.94);}

  /* ラベル（かお + まる） */
  .face{flex:0 0 auto; pointer-events:none;}
  .badge{
    flex:0 0 auto; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    color:#fff; font-weight:700;
    letter-spacing:-.04em;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);
  }
  body.names-off .face, body.names-off .badge{display:none;}

  /* とんでいく♪ */
  .spark{
    position:absolute; z-index:9; pointer-events:none;
    font-size:28px; color:#ff5aa8; text-shadow:0 1px 0 #fff;
    animation:fly .8s ease-out forwards;
  }
  @keyframes fly{
    from{opacity:1; transform:translate(0,0) rotate(0deg) scale(.8);}
    to{opacity:0; transform:translate(-70px,-46px) rotate(-24deg) scale(1.5);}
  }
</style>
</head>
<body>

<div id="bar">
  <button id="octMinus" aria-label="ひくい おと">◀ ひくい</button>
  <button id="octCount"><span class="k">おとのかず</span>2オクターブ</button>
  <button id="octPlus" aria-label="たかい おと">たかい ▶</button>
  <button id="inst"><span class="k">がっき</span>ピアノ</button>
  <button id="names"><span class="k">なまえ</span>ひらがな</button>
  <button id="lock" class="icon" aria-label="ボタンを ロック">🔒</button>
  <button id="full" class="icon" aria-label="ぜんがめん">⛶</button>
</div>

<div id="piano"></div>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ *
 * おとの じょうほう
 * ------------------------------------------------------------------ */
const WHITE = {                       // pitchClass -> ラベルと いろ(HSL)
   0:{ja:'ど',   abc:'C', h:  2, s:78, l:48},
   2:{ja:'れ',   abc:'D', h: 28, s:92, l:48},
   4:{ja:'み',   abc:'E', h: 78, s:58, l:44},
   5:{ja:'ふぁ', abc:'F', h:145, s:80, l:34},
   7:{ja:'そ',   abc:'G', h:215, s:78, l:48},
   9:{ja:'ら',   abc:'A', h:275, s:52, l:48},
  11:{ja:'し',   abc:'B', h:325, s:82, l:47}
};
const isWhite = m => WHITE.hasOwnProperty(((m % 12) + 12) % 12);
const freqOf  = m => 440 * Math.pow(2, (m - 69) / 12);
const clamp   = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);

const state = {
  baseOctave : 4,       // いちばん ひくい ど（C4 = まんなかのド）
  octaves    : 2,
  inst       : 0,
  names      : 0,       // 0:ひらがな 1:ABC 2:なし
  locked     : false
};
const INSTS = ['ピアノ','オルガン','ベル','マリンバ'];

/* ================================================================== *
 * おとの エンジン
 *   ・ばいおん を 40ぽん まで まとめた はけい（PeriodicWave）を 3つの たいいき に わけ、
 *     たいいき ごとに きえる はやさ を かえる（たかい ばいおん ほど はやく きえる）
 *   ・ピアノは わずかに ずれた ふくすうの げん ＋ ハンマーの おと
 *   ・さいごに EQ（ひくい にごり を カット、たかい ほうを もちあげ）と
 *     かるい リバーブ を とおす
 * ================================================================== */
let ctx = null, bus = null, master = null, noiseBuf = null;

function audio(){
  if(ctx) return ctx;
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  // ---- リミッター（おとが われないように） ----
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -3;      // ピークだけ おさえる（ふだんは かからない）
  limiter.knee.value      = 6;
  limiter.ratio.value     = 20;
  limiter.attack.value    = 0.002;
  limiter.release.value   = 0.15;
  limiter.connect(ctx.destination);

  master = ctx.createGain();
  master.gain.value = 2.4;
  master.connect(limiter);

  // ---- おとを クリアに する ための EQ ----
  // ① 100Hz より したの ゴロゴロ を カット
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 110; hp.Q.value = 0.7;
  // ② 300Hz あたりの もこもこ を へらす
  const mud = ctx.createBiquadFilter();
  mud.type = 'peaking'; mud.frequency.value = 300; mud.Q.value = 1.0; mud.gain.value = -4.5;
  // ③ 3.5kHz から うえを もちあげて きらきら させる
  const air = ctx.createBiquadFilter();
  air.type = 'highshelf'; air.frequency.value = 3000; air.gain.value = 5;
  hp.connect(mud); mud.connect(air); air.connect(master);

  // ---- リバーブ（へやの ひびき／ひくい おとには かけない） ----
  const conv = ctx.createConvolver();
  conv.buffer = makeIR(1.5, 3.2);
  const revHp = ctx.createBiquadFilter();
  revHp.type = 'highpass'; revHp.frequency.value = 700;   // 低音を ひびかせると にごる
  const wet = ctx.createGain();
  wet.gain.value = 0.13;
  revHp.connect(conv); conv.connect(wet); wet.connect(master);

  bus = ctx.createGain();
  bus.gain.value = 1;
  bus.connect(hp);
  bus.connect(revHp);

  // ハンマーの おと につかう ノイズ
  const len = Math.floor(ctx.sampleRate * 0.25);
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for(let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;

  return ctx;
}

/* インパルスレスポンスを その場で つくる（おんげんファイル不要） */
function makeIR(dur, decay){
  const rate = ctx.sampleRate, len = Math.floor(rate * dur);
  const buf = ctx.createBuffer(2, len, rate);
  for(let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    for(let i = 0; i < len; i++){
      const t = i / len;
      const fadeIn = 1 - Math.exp(-i / (rate * 0.006));   // あたまを やわらかく
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * fadeIn * 0.7;
    }
  }
  return buf;
}

function unlock(){
  const c = audio();
  if(c.state === 'suspended') c.resume();
  const b = c.createBufferSource();
  b.buffer = c.createBuffer(1, 1, 22050);
  b.connect(master); b.start(0);
}

/* ---- ばいおん を まとめた はけい を つくる ----
 * サイン波を 1ぽんずつ ならべる やりかた だと ばいおん の かず に かぎりが あり、
 * たかい ばいおん が たりなく なって こもった おと に なる。
 * PeriodicWave なら ばいおん を 40ぽん でも オシレーター 1つ で だせて、
 * しかも ブラウザが かってに おりかえし（エイリアス）を ふせいで くれる。
 */
const waveCache = {};
function wave(key, from, to, ampFn){
  if(waveCache[key]) return waveCache[key];
  const re = new Float32Array(to + 1), im = new Float32Array(to + 1);
  for(let n = from; n <= to; n++){
    const a  = ampFn(n);
    const ph = n * 2.39996;              // いちを ばらけさせて とがった はけい に しない
    re[n] = a * Math.cos(ph);
    im[n] = a * Math.sin(ph);
  }
  const w = ctx.createPeriodicWave(re, im, {disableNormalization:true});
  waveCache[key] = w;
  return w;
}
function sumAmp(from, to, ampFn){
  let s = 0;
  for(let n = from; n <= to; n++) s += ampFn(n);
  return s;
}

/* ---- がっき ごとの おと の せっけい ---- */
const PIANO_H = n => Math.pow(n, -0.85) * (n % 2 ? 1 : 0.82);
const ORGAN_T = {1:1, 2:0.6, 3:0.5, 4:0.35, 6:0.22, 8:0.15, 10:0.1, 12:0.07, 16:0.04};
const ORGAN_H = n => ORGAN_T[n] || 0;

function spec(inst, midi){
  const f = freqOf(midi);
  const bands = [];

  if(inst === 0){            // ピアノ
    const base = clamp(6.5 * Math.pow(0.5, (midi - 33) / 24), 0.8, 4.5);
    // ひくい ばいおん は ながく のこり、たかい ばいおん ほど はやく きえる
    bands.push({wave:wave('pLo',  1,  6, PIANO_H), a:1,    d:base});
    bands.push({wave:wave('pLo',  1,  6, PIANO_H), a:0.42, d:base * 0.95, detune:2.2}); // となりの げん
    // げんの かたさ で たかい ばいおん は すこし うわずる（ピアノ らしい きらめき）
    bands.push({wave:wave('pMid', 7, 16, PIANO_H), a:1,    d:base * 0.34, detune:4});
    bands.push({wave:wave('pHi', 17, 40, PIANO_H), a:1,    d:base * 0.13, detune:14});
    return {bands:bands, sum:sumAmp(1, 40, PIANO_H) * 1.42,
            atk:0.005, hold:false, noise:0.10, rel:0.10, level:1.0};
  }

  if(inst === 1){            // オルガン（おしている あいだ のびる）
    bands.push({wave:wave('org', 1, 16, ORGAN_H), a:1,   d:0});
    bands.push({wave:wave('org', 1, 16, ORGAN_H), a:0.5, d:0, detune:3});  // すこし ずらして あつく
    return {bands:bands, sum:sumAmp(1, 16, ORGAN_H) * 1.5,
            atk:0.026, hold:true, noise:0.02, rel:0.10, level:0.50};
  }

  if(inst === 2){            // ベル（ばいおん が せいすう倍で ない）
    const base = clamp(5.0 * Math.pow(0.5, (midi - 60) / 34), 1.0, 5);
    let sum = 0;
    [[0.56,0.55],[0.92,0.6],[1.19,0.55],[1.71,0.42],[2.0,0.36],[2.74,0.3],
     [3.0,0.24],[3.76,0.2],[4.07,0.17],[5.43,0.12],[6.8,0.09],[8.2,0.06]]
      .forEach(([r, a], i) => {
        if(f * r > 17000) return;
        sum += a;
        bands.push({ratio:r, a:a, d:base * (1 - i * 0.06)});
      });
    return {bands:bands, sum:sum, atk:0.002, hold:false, noise:0.05, rel:0.30, level:1.25};
  }

  // マリンバ（きの ばん の モード）
  const base = clamp(1.4 * Math.pow(0.5, (midi - 60) / 30), 0.25, 1.6);
  let sum = 0;
  [[1,1,1],[3.932,0.5,0.32],[9.538,0.22,0.14],[16.688,0.1,0.08]].forEach(([r, a, dm]) => {
    if(f * r > 17000) return;
    sum += a;
    bands.push({ratio:r, a:a, d:base * dm});
  });
  return {bands:bands, sum:sum, atk:0.002, hold:false, noise:0.08, rel:0.08, level:1.5};
}

const voices = new Map();     // midi -> voice
const MAX_VOICES = 14;

function noteOn(midi){
  const c = audio();
  if(c.state === 'suspended') c.resume();
  if(voices.has(midi)) noteOff(midi, 0.02);

  if(voices.size >= MAX_VOICES) noteOff(voices.keys().next().value, 0.05);

  const s = spec(state.inst, midi);
  const t = c.currentTime + 0.002;

  const g = c.createGain();
  // ぜんぶの ばいおん を たしても おおきく なりすぎない ように ならす
  const peak = 0.30 * s.level / (s.sum || 1)
             * Math.pow(2, -(midi - 60) / 70)          // たかい おとは すこし ちいさく
             * (0.94 + Math.random() * 0.12);          // まいかい ほんの すこし ちがう
  g.gain.setValueAtTime(peak, t);

  let tail = g;
  if(c.createStereoPanner){                            // おとの たかさで ひだり/みぎ に ひろげる
    const pan = c.createStereoPanner();
    pan.pan.value = clamp((midi - 60) / 24, -1, 1) * 0.32;
    g.connect(pan); pan.connect(bus);
    tail = pan;
  }else{
    g.connect(bus);
  }

  const oscs = s.bands.map(p => {
    const o  = c.createOscillator();
    const pg = c.createGain();
    if(p.wave) o.setPeriodicWave(p.wave);         // ばいおん を まとめた はけい
    else       o.type = 'sine';                   // ベル・マリンバ は 1つずつ
    o.frequency.setValueAtTime(freqOf(midi) * (p.ratio || 1), t);
    if(p.detune) o.detune.setValueAtTime(p.detune, t);
    pg.gain.setValueAtTime(0.0001, t);
    pg.gain.linearRampToValueAtTime(p.a, t + s.atk);
    if(!s.hold) pg.gain.exponentialRampToValueAtTime(0.0001, t + s.atk + p.d);
    o.connect(pg); pg.connect(g);
    o.start(t);
    o.stop(t + (s.hold ? 3600 : s.atk + p.d + 0.15));
    return o;
  });

  // ハンマー／ばち が あたる おと
  if(s.noise){
    const src = c.createBufferSource(), bp = c.createBiquadFilter(), ng = c.createGain();
    src.buffer = noiseBuf;
    bp.type = 'highpass';                        // たかい ほうだけ のこすと あたま が はっきり する
    bp.frequency.value = clamp(freqOf(midi) * 3, 1200, 6000);
    bp.Q.value = 0.7;
    ng.gain.setValueAtTime(s.noise, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    src.connect(bp); bp.connect(ng); ng.connect(g);
    src.start(t); src.stop(t + 0.12);
  }

  voices.set(midi, {g:g, oscs:oscs, rel:s.rel, tail:tail});
}

function noteOff(midi, forceRel){
  const v = voices.get(midi);
  if(!v) return;
  voices.delete(midi);
  const c = audio(), t = c.currentTime;
  const rel = forceRel || v.rel;
  try{
    if(v.g.gain.cancelAndHoldAtTime) v.g.gain.cancelAndHoldAtTime(t);
    else v.g.gain.cancelScheduledValues(t);
    v.g.gain.setTargetAtTime(0.0001, t, rel / 3);      // ダンパーが そっと おさえる
  }catch(e){}
  v.oscs.forEach(o => { try{ o.stop(t + rel + 0.05); }catch(e){} });
  setTimeout(() => { try{ v.tail.disconnect(); v.g.disconnect(); }catch(e){} }, (rel + 0.3) * 1000);
}

function allOff(){ [...voices.keys()].forEach(m => noteOff(m, 0.05)); }

/* ------------------------------------------------------------------ *
 * けんばんを つくる（うえが たかい おと）
 * ------------------------------------------------------------------ */
const piano = document.getElementById('piano');
const keyEls = new Map();

function build(){
  piano.innerHTML = '';
  keyEls.clear();

  const lo = 12 * (state.baseOctave + 1);          // C4 = 60
  const hi = lo + 12 * state.octaves;
  const whites = [];
  for(let m = hi; m >= lo; m--) if(isWhite(m)) whites.push(m);   // うえ→した

  const n = whites.length;
  const hPct = 100 / n;
  const badge = clamp((piano.clientHeight / n) * 0.78, 22, 52);
  const faceW = Math.min(34, badge * 0.8);

  whites.forEach((m, i) => {
    const info = WHITE[m % 12];
    const oct  = Math.floor((m - lo) / 12);
    const el = document.createElement('div');
    el.className = 'white';
    el.style.top    = (i * hPct) + '%';
    el.style.height = hPct + '%';
    el.dataset.midi = m;

    // たかい オクターブ ほど すこし あかるい いろ
    const color = 'hsl(' + info.h + ',' + info.s + '%,' + (info.l - 5 + Math.min(oct, 3) * 7) + '%)';
    el.innerHTML =
      '<svg class="face" width="' + faceW + '" height="' + (faceW * 0.72) + '" viewBox="0 0 34 24">' +
        '<circle cx="8"  cy="7" r="2.4" fill="#2b2b2b"/>' +
        '<circle cx="19" cy="7" r="2.4" fill="#2b2b2b"/>' +
        '<path d="M5 12 q8.5 9 17 0" stroke="#f7a6a6" stroke-width="3" fill="none" stroke-linecap="round"/>' +
        '<circle cx="3"  cy="14" r="3" fill="#ffc8c8"/>' +
        '<circle cx="24" cy="14" r="3" fill="#ffc8c8"/>' +
      '</svg>' +
      '<div class="badge" style="width:' + badge + 'px;height:' + badge + 'px;' +
        'font-size:' + (badge * (info.ja.length > 1 ? 0.36 : 0.5)) + 'px;background:' + color + ';' +
        (oct > 0 ? 'box-shadow:inset 0 0 0 3px rgba(255,255,255,.85), inset 0 -2px 0 rgba(0,0,0,.12);' : '') +
      '">' + (state.names === 1 ? info.abc + (Math.floor(m / 12) - 1) : info.ja) + '</div>';

    piano.appendChild(el);
    keyEls.set(m, el);
  });

  const bh = hPct * 0.62;
  for(let i = 0; i < n - 1; i++){
    if(whites[i] - whites[i+1] !== 2) continue;
    const m = whites[i] - 1;
    const el = document.createElement('div');
    el.className = 'black';
    el.style.top = ((i + 1) * hPct - bh / 2) + '%';
    el.style.height = bh + '%';
    el.dataset.midi = m;
    piano.appendChild(el);
    keyEls.set(m, el);
  }
}

/* ------------------------------------------------------------------ *
 * タッチ（ゆびを なんぼんでも OK）
 * ------------------------------------------------------------------ */
const pointers = new Map();

function midiAt(x, y){
  const hit = document.elementFromPoint(x, y);
  const el  = hit && hit.closest ? hit.closest('[data-midi]') : null;
  return el ? +el.dataset.midi : null;
}
function press(id, midi){
  const cur = pointers.get(id);
  if(cur === midi) return;
  if(cur !== undefined) release(id);
  if(midi === null || midi === undefined) return;
  pointers.set(id, midi);
  const el = keyEls.get(midi);
  if(el){ el.classList.add('on'); spark(el); }
  noteOn(midi);
}
function release(id){
  const midi = pointers.get(id);
  if(midi === undefined) return;
  pointers.delete(id);
  let held = false;
  pointers.forEach(v => { if(v === midi) held = true; });
  if(!held){
    const el = keyEls.get(midi);
    if(el) el.classList.remove('on');
    noteOff(midi);
  }
}
function spark(el){
  const s = document.createElement('div');
  s.className = 'spark';
  s.textContent = Math.random() < .5 ? '♪' : '♫';
  const r = el.getBoundingClientRect(), p = piano.getBoundingClientRect();
  s.style.left = (r.right - p.left - 60) + 'px';
  s.style.top  = (r.top - p.top + r.height / 2 - 20) + 'px';
  piano.appendChild(s);
  s.addEventListener('animationend', () => s.remove());
}

piano.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlock();
  press(e.pointerId, midiAt(e.clientX, e.clientY));
});
piano.addEventListener('pointermove', e => {
  if(!pointers.has(e.pointerId)) return;
  e.preventDefault();
  press(e.pointerId, midiAt(e.clientX, e.clientY));
});
['pointerup','pointercancel','pointerleave'].forEach(t =>
  window.addEventListener(t, e => release(e.pointerId))
);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => { [...pointers.keys()].forEach(release); allOff(); });

/* ------------------------------------------------------------------ *
 * ボタン
 * ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
function refresh(){
  $('octCount').innerHTML = '<span class="k">おとのかず</span>' + state.octaves + 'オクターブ';
  $('inst').innerHTML     = '<span class="k">がっき</span>' + INSTS[state.inst];
  $('names').innerHTML    = '<span class="k">なまえ</span>' + ['ひらがな','ABC','なし'][state.names];
  document.body.classList.toggle('names-off', state.names === 2);
  $('octMinus').disabled = state.baseOctave <= 1;
  $('octPlus').disabled  = state.baseOctave + state.octaves >= 8;
  build();
  save();
}
$('octCount').onclick = () => { state.octaves = state.octaves === 2 ? 3 : (state.octaves === 3 ? 1 : 2);
                                if(state.baseOctave + state.octaves > 8) state.baseOctave = 8 - state.octaves;
                                allOff(); refresh(); };
$('octMinus').onclick = () => { if(state.baseOctave > 1){ state.baseOctave--; allOff(); refresh(); } };
$('octPlus').onclick  = () => { if(state.baseOctave + state.octaves < 8){ state.baseOctave++; allOff(); refresh(); } };
$('inst').onclick     = () => { allOff(); state.inst = (state.inst + 1) % INSTS.length; unlock(); refresh(); };
$('names').onclick    = () => { state.names = (state.names + 1) % 3; refresh(); };
$('lock').onclick     = () => { state.locked = !state.locked;
                                $('lock').classList.toggle('on', state.locked);
                                $('lock').textContent = state.locked ? '🔓' : '🔒';
                                document.body.classList.toggle('locked', state.locked); };
$('full').onclick     = () => {
  const el = document.documentElement;
  if(document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }else if(el.requestFullscreen || el.webkitRequestFullscreen){
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
};
if(!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)){
  $('full').style.display = 'none';
}

function save(){
  try{ localStorage.setItem('doremi', JSON.stringify(
    {baseOctave:state.baseOctave, octaves:state.octaves, inst:state.inst, names:state.names})); }catch(e){}
}
try{
  const s = JSON.parse(localStorage.getItem('doremi') || 'null');
  if(s) Object.assign(state, s);
}catch(e){}

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
window.addEventListener('orientationchange', () => setTimeout(build, 300));

refresh();
})();
</script>
</body>
</html>
